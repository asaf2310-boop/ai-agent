name: Job scan twice daily

on:
  schedule:
    # ~08:00 and ~20:00 Asia/Jerusalem (approx; UTC)
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan, match, tailor, apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SCHEMA: job_agent
          MIN_MATCH_SCORE: "0.3"
          MAX_JOB_AGE_DAYS: "7"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPLICATION_NOTIFY_EMAIL: ${{ secrets.APPLICATION_NOTIFY_EMAIL }}
          APPLICATION_FROM_EMAIL: ${{ secrets.APPLICATION_FROM_EMAIL }}
          SOCIAL_RSS_URLS: ${{ secrets.SOCIAL_RSS_URLS }}
        run: python refresh.py
